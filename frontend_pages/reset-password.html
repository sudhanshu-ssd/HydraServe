<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — HydraServe</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0b0d12;
    color: #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
  }
  .card {
    background: #12151c;
    border: 1px solid #232838;
    border-radius: 14px;
    padding: 32px;
    width: 100%;
    max-width: 400px;
  }
  .tag {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: #2dd4bf;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  h1 { font-size: 19px; margin: 0 0 6px; font-weight: 650; }
  p.sub { color: #8b93a3; font-size: 13.5px; margin: 0 0 24px; line-height: 1.5; }
  code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    background: #0b0d12;
    border: 1px solid #232838;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 12.5px;
    color: #9aa1b1;
  }
  label { display: block; font-size: 12.5px; color: #9aa1b1; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #232838;
    background: #0b0d12;
    color: #e5e7eb;
    font-size: 14px;
    margin-bottom: 14px;
  }
  input:focus { outline: 2px solid #2dd4bf; outline-offset: 1px; }
  button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: #2dd4bf;
    color: #06110f;
    font-size: 14px;
    font-weight: 650;
    cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  .msg { margin-top: 16px; font-size: 13px; padding: 10px 12px; border-radius: 8px; line-height: 1.4; }
  .msg.ok { background: #0d2a24; color: #6ee7d4; border: 1px solid #164e42; }
  .msg.err { background: #2a1414; color: #f2a3a3; border: 1px solid #4e1616; }
  .hidden { display: none; }
  .endpoint {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11.5px;
    color: #5b6272;
    margin-top: 14px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card" id="card"></div>

  <script>
    // Point this at wherever your FastAPI backend actually runs.
    const API_BASE = "http://localhost:8000";

    const token = new URLSearchParams(window.location.search).get('token');
    const card = document.getElementById('card');

    if (!token) {
      card.innerHTML = `
        <div class="tag">HydraServe</div>
        <h1>No reset token found</h1>
        <p class="sub">This page expects a link shaped like <code>reset-password.html?token=...</code> — the one your backend emails out. Open it from the email rather than visiting this page directly.</p>
      `;
    } else {
      card.innerHTML = `
        <div class="tag">HydraServe</div>
        <h1>Set a new password</h1>
        <p class="sub">Token read from the URL. Choose a new password below.</p>

        <label for="pw">New password</label>
        <input type="password" id="pw" minlength="8" autocomplete="new-password" required>

        <label for="pw2">Confirm password</label>
        <input type="password" id="pw2" minlength="8" autocomplete="new-password" required>

        <button id="submitBtn">Reset password</button>
        <div id="msg" class="msg hidden"></div>
        <div class="endpoint">→ POST /reset-password</div>
      `;
      document.getElementById('submitBtn').addEventListener('click', submitNewPassword);
    }

    async function submitNewPassword() {
      const pw = document.getElementById('pw').value;
      const pw2 = document.getElementById('pw2').value;
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');

      if (pw.length < 8) {
        msg.className = "msg err";
        msg.textContent = "Password needs to be at least 8 characters.";
        return;
      }
      if (pw !== pw2) {
        msg.className = "msg err";
        msg.textContent = "Passwords don't match.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Resetting…";
      msg.className = "msg hidden";

      try {
        const res = await fetch(`${API_BASE}/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, new_password: pw })
        });
        const data = await res.json().catch(() => ({}));

        msg.className = res.ok ? "msg ok" : "msg err";
        msg.textContent = data.message || data.detail || `Unexpected response (${res.status}).`;

        if (res.ok) {
          btn.textContent = "Done";
        } else {
          btn.disabled = false;
          btn.textContent = "Reset password";
        }
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = "Couldn't reach the backend. Check it's running and that API_BASE and CORS are set up.";
        btn.disabled = false;
        btn.textContent = "Reset password";
      }
    }
  </script>
</body>
</html>
