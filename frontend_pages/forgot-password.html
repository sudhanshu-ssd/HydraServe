<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password — HydraServe</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0b0d12;
    color: #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
  }
  .card {
    background: #12151c;
    border: 1px solid #232838;
    border-radius: 14px;
    padding: 32px;
    width: 100%;
    max-width: 400px;
  }
  .tag {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: #2dd4bf;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  h1 { font-size: 19px; margin: 0 0 6px; font-weight: 650; }
  p.sub { color: #8b93a3; font-size: 13.5px; margin: 0 0 24px; line-height: 1.5; }
  label { display: block; font-size: 12.5px; color: #9aa1b1; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #232838;
    background: #0b0d12;
    color: #e5e7eb;
    font-size: 14px;
    margin-bottom: 8px;
  }
  input:focus { outline: 2px solid #2dd4bf; outline-offset: 1px; }
  button {
    width: 100%;
    padding: 11px;
    margin-top: 12px;
    border: none;
    border-radius: 8px;
    background: #2dd4bf;
    color: #06110f;
    font-size: 14px;
    font-weight: 650;
    cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  .msg { margin-top: 16px; font-size: 13px; padding: 10px 12px; border-radius: 8px; line-height: 1.4; }
  .msg.ok { background: #0d2a24; color: #6ee7d4; border: 1px solid #164e42; }
  .msg.err { background: #2a1414; color: #f2a3a3; border: 1px solid #4e1616; }
  .hidden { display: none; }
  .endpoint {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11.5px;
    color: #5b6272;
    margin-top: 14px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">HydraServe</div>
    <h1>Forgot your password?</h1>
    <p class="sub">Enter the email on your account. If it exists, a reset link is on its way.</p>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>

    <button id="submitBtn">Send reset link</button>
    <div id="msg" class="msg hidden"></div>
    <div class="endpoint">→ POST /forgot-password</div>
  </div>

  <script>
    // Point this at wherever your FastAPI backend actually runs.
    const API_BASE = "http://localhost:8000";

    document.getElementById('submitBtn').addEventListener('click', submitReset);
    document.getElementById('email').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitReset();
    });

    async function submitReset() {
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');
      if (!email) return;

      btn.disabled = true;
      btn.textContent = "Sending…";
      msg.className = "msg hidden";

      try {
        const res = await fetch(`${API_BASE}/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const data = await res.json().catch(() => ({}));

        msg.className = res.ok ? "msg ok" : "msg err";
        msg.textContent = data.message || data.detail || `Unexpected response (${res.status}).`;
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = "Couldn't reach the backend. Check it's running and that API_BASE and CORS are set up.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Send reset link";
      }
    }
  </script>
</body>
</html>
